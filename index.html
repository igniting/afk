<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="description" content="Night Shift — build your own agent, leave it in charge, and see whether your design survives the night." />
    <title>Night Shift</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b1120'/%3E%3Ccircle cx='20' cy='12' r='9' fill='%235eead4'/%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip" href="#side">Skip to panel</a>
    <div id="app" class="app" data-mode="title">
      <header class="topbar">
        <div class="brand"><span class="brand-dot" aria-hidden="true"></span><strong>Night Shift</strong></div>
        <div class="clock-wrap">
          <span class="clock" id="clock" aria-label="Simulated time">18:00</span>
          <span id="mode-chip" class="chip">Build</span>
        </div>
        <div class="controls" id="controls"></div>
        <div class="meters" id="meters"></div>
      </header>
      <nav class="mobile-tabs" id="mobile-tabs" aria-label="View"></nav>
      <main class="layout">
        <aside class="rail" id="rail" aria-label="Promises"></aside>
        <section class="machine" id="machine" aria-label="Machine board">
          <div id="board" class="board"></div>
          <div id="board-hint" class="board-hint" aria-live="polite"></div>
          <div id="toasts" class="toasts" aria-live="polite"></div>
        </section>
        <aside class="side" id="side" tabindex="-1"></aside>
      </main>
      <footer class="timeline" id="timeline"></footer>
    </div>
    <div id="overlay" class="overlay" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
